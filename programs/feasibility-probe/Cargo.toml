[package]
name = "biolab-feasibility-probe"
version = "0.1.0"
edition = "2021"
publish = false
autotests = false

[workspace]

[lib]
name = "biolab_feasibility_probe"
crate-type = ["cdylib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "=3.0.0"
sha2 = { version = "=0.10.9", default-features = false }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[package.metadata.solana]
tools-version = "v1.56"
