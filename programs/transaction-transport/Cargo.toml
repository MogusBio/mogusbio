[package]
name = "biolab-transaction-transport"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
solana-program-test = { version = "=4.3.2", features = ["agave-unstable-api"] }
solana-message = { version = "=4.6.0", features = ["wincode"] }
solana-transaction = { version = "=4.3.0", features = ["wincode", "verify"] }
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-instruction = "=3.5.1"
solana-hash = "=4.6.0"
solana-account = "=4.5.0"
solana-address = "=2.9.0"
solana-clock = "=4.0.0"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
wincode = "=0.6.3"
biolab-economy = { path = "../biolab-economy", features = ["no-entrypoint"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[profile.dev]
debug = 0

[profile.test]
debug = 0
