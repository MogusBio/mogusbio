[package]
name = "biolab-economy-harness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
production-fixture = []

[dependencies]
mollusk-svm = {version="=0.16.2",features=["invocation-inspect-callback"]}
mollusk-svm-programs-token = { version = "=0.16.0", default-features = false, features = ["token", "associated-token"] }
sha2 = "=0.10.9"
solana-account = "4"
solana-instruction = "3"
solana-pubkey = "4"
solana-program-runtime = "=4.3.2"
solana-transaction-context = "=4.3.2"
biolab-kernel = {path="../../biolab-kernel",features=["no-entrypoint"]}

[[test]]
name = "native_economy"
path = "tests/native_economy.rs"

[[test]]
name = "native_settlement"
path = "tests/native_settlement.rs"

[[test]]
name = "native_p5"
path = "tests/native_p5.rs"

[[test]]
name = "native_synthesis"
path = "tests/native_synthesis.rs"
