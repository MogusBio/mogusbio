[package]
name="biolab-provenance-probe"
version="0.1.0"
edition="2021"
publish=false
[workspace]
[lib]
name="biolab_provenance_probe"
crate-type=["cdylib"]
[features]
default=["custom-heap"]
custom-heap=[]
[dependencies]
solana-program="=3.0.0"
sha2={version="=0.10.9",default-features=false,features=["compress"]}
biolab-kernel={path="../biolab-kernel",features=["no-entrypoint"]}
[profile.release]
overflow-checks=true
lto="fat"
codegen-units=1
[package.metadata.solana]
tools-version="v1.56"
